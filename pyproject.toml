[project]
name = "storyforge"
version = "0.1.0"
description = "AI-powered novel-to-screenplay converter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.10.0",
    "streamlit>=1.30.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]