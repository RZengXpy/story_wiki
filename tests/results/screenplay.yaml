screenplay: "{\n  \"screenplay\": \"EXT. 雾港镇 - 白天\\n\\n雨连绵不绝，海风裹挟咸湿雾气穿过街道。老旧路灯在雨幕中忽明忽暗。\\\
  n\\nINT. 镇图书馆 - 下午\\n\\n林川，三十岁，整理着书桌上的档案。大门被推开，一位老人走进来。\\n\\n老人：\\n（深沉）\\n请问，这里还保存着“北辰号”的航海日志吗？\\\
  n\\n林川抬起头，愣了一下。\\n\\n林川：\\n北辰号……那艘二十年前失踪的货船？\\n\\n老人点点头。\\n\\n林川：\\n跟我来吧。\\n\\nINT.\
  \ 地下档案室 - 下午\\n\\n林川和老人翻找档案柜。编号N-27的位置空空如也。\\n\\n林川：\\n奇怪，日志应该在这里的。\\n\\n他在柜底发现一张泛黄纸条。\\\
  n\\n林川（念）：\\n“不要寻找灯塔下面的秘密。”\\n\\n老人脸色骤变。\\n\\n老人：\\n已经有人先一步拿走了。\\n\\n他转身匆匆离开。\\\
  n\\nINT. 图书馆 - 晚上\\n\\n林川独自在灯下研究纸条。他翻转纸条，看到几乎看不见的小字。\\n\\n林川（轻声）：\\n“10月17日，午夜。”\\\
  n\\nINT. 林川家 - 第二天\\n\\n林川和朋友陈雨坐在沙发上。\\n\\n林川：\\n纸条背后有日期——今晚午夜。\\n\\n陈雨：\\n（兴奋）\\\
  n灯塔下面的秘密？这太值得调查了。\\n\\nINT. 废弃灯塔 - 傍晚六点\\n\\n锈蚀大门半掩。林川和陈雨进入。地板上有新鲜脚印。\\n\\n他们沿螺旋楼梯向下。\\\
  n\\n地下室尽头有一扇铁门。推开后，是秘密储藏室。\\n\\n房间中央防水金属箱。打开，是一本残破航海日志。\\n\\n林川：\\n《北辰号航海记录》。\\\
  n\\n突然，脚步声。门口出现一个黑衣男人。\\n\\n黑衣男人：\\n把日志交出来。\\n\\n陈雨偷偷按录音笔。沉默对峙。\\n\\n黑衣男人逼近。抢夺中，金属箱跌地。\\\
  n\\n从夹层中滑出一张地图。标记着一座无名小岛。\\n\\n黑衣男人看到地图，慌张起来，转身逃离。\\n\\n林川捡起地图。\\n\\n林川：\\n（低声）\\\
  n或许和这个岛有关。\\n\\nINT. 渔船 - 10月17日午夜\\n\\n海面浓雾。船长老周掌舵。\\n\\n老周：\\n这天气真不适合出海。\\n\\\
  n林川：\\n我们必须去地图上的位置。\\n\\nEXT. 神秘岛 - 凌晨一点\\n\\n船靠岸。三人登岛。岛中央矗立废弃观测站。\\n\\nINT. 观测站主控室\
  \ - 凌晨\\n\\n设备陈旧但能运转。林川找到加密文件。\\n\\n林川（读文件）：\\n“北辰号在海底发现特殊矿石……干扰无线电信号。”\\n\\n陈雨：\\\
  n所以根本不是海难！是有人伪造事故！\\n\\n突然，外面发动机轰鸣。数辆越野车包围建筑。\\n\\n黑衣男人出现。\\n\\n黑衣男人：\\n把文件留下。\\\
  n\\n陈雨打开手机，开始直播。\\n\\n陈雨：\\n（对着镜头）\\n各位，这里是国际船运的黑暗秘密……\\n\\n黑衣男人试图阻止，但内容已上传网络。\\\
  n\\n黑衣男人意识到无法掩盖，转身离开。\\n\\nEXT. 观测站外 - 黎明\\n\\n浓雾散去。许远，那位老人，从远处走来。\\n\\n许远（对林川）：\\\
  n谢谢你们……让我在有生之年看到真相。\\n\\n林川点头。晨光照亮整片海域。\\n\"]\n}"
